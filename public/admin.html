<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin CS - Spaceman88</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    #admin-chat-box::-webkit-scrollbar { width: 4px; }
    #admin-chat-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    #queue-list::-webkit-scrollbar { width: 4px; }
    #queue-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .chat-text a { color: #818cf8; text-decoration: underline; }
    .chat-text a:hover { color: #a5b4fc; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header Dashboard -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></div>
      <h1 class="text-lg font-bold">Support Console Dashboard Spaceman88</h1>
    </div>
    <span class="text-xs bg-slate-800 text-slate-400 px-3 py-1 rounded-full border border-slate-700">Status: Active Agent</span>
  </header>

  <div class="flex-1 flex overflow-hidden">
    <!-- Panel Antrean Chat (Sidebar Daftar Room Member) -->
    <aside class="w-80 bg-slate-900/60 border-r border-slate-800 p-4 flex flex-col">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">Antrean Percakapan</h2>
      <div class="space-y-2 overflow-y-auto flex-1 pr-1" id="queue-list">
        <!-- Daftar room akan dimuat secara dinamis oleh JavaScript -->
        <div class="text-xs text-slate-500 text-center py-4">Memuat antrean member...</div>
      </div>
    </aside>

    <!-- Main Chat Room Area -->
    <main class="flex-1 flex flex-col bg-slate-950">
      
      <!-- Top Control Bar -->
      <div class="bg-slate-900/80 p-4 border-b border-slate-800 flex justify-between items-center">
        <div>
          <h2 id="active-room-title" class="font-semibold text-sm">Pilih ruang chat dari antrean sebelah kiri</h2>
          <p id="mode-status" class="text-xs text-slate-400">Mode: -</p>
        </div>

        <!-- Toggle Switch Bot Off / Ambil Alih -->
        <label class="flex items-center gap-3 cursor-pointer bg-slate-800 px-4 py-2 rounded-xl border border-slate-700">
          <span class="text-xs font-medium text-slate-300">Ambil Alih (Matikan Bot):</span>
          <input type="checkbox" id="takeover-toggle" class="sr-only peer">
          <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600 relative"></div>
        </label>
      </div>

      <!-- Admin Chat Box -->
      <div id="admin-chat-box" class="flex-1 p-6 overflow-y-auto space-y-4 bg-slate-950">
        <div class="flex flex-col items-center justify-center h-full text-slate-500 text-xs">
          Silakan klik salah satu nama member di panel kiri untuk mulai membalas chat.
        </div>
      </div>

      <!-- Quick Reply Templates untuk Slot -->
      <div class="px-6 py-2 bg-slate-900/40 border-t border-slate-800/60 flex gap-2 overflow-x-auto text-xs">
        <span class="text-slate-400 self-center font-semibold text-[11px]">Template Balasan:</span>
        <button onclick="sendQuickReply('Halo Bapak! Ada yang bisa kami bantu untuk akun atau transaksinya hari ini?')" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 transition whitespace-nowrap">👋 Sapaan Slot</button>
        <button onclick="sendQuickReply('Boleh diinfokan User ID dan bukti transfernya Bapak? Biar kami bantu cek loket depositnya.')" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 transition whitespace-nowrap">💳 Cek Depo/WD</button>
        <button onclick="sendQuickReply('Mohon ditunggu 1-3 menit ya Bapak, transaksi sedang diproses oleh tim keuangan.')" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 transition whitespace-nowrap">⏳ Proses WD</button>
        <button onclick="sendQuickReply('Silakan cek bocoran RTP Live terbaru kami melalui menu utama ya Bapak!')" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 transition whitespace-nowrap">🎰 Info RTP</button>
      </div>

      <!-- Input Balasan Admin -->
      <form id="admin-form" class="p-4 bg-slate-900 border-t border-slate-800 flex gap-3">
        <input id="admin-input" type="text" placeholder="Ketik balasan manual sebagai CS Agent..." class="flex-1 bg-slate-950 text-white text-xs rounded-xl px-4 py-3 border border-slate-800 focus:outline-none focus:border-indigo-500" />
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-6 py-3 rounded-xl font-semibold transition">Kirim (CS)</button>
      </form>
    </main>
  </div>

  <script>
    const socket = io();
    let currentRoomId = null;
    let allRoomsData = {};

    const queueList = document.getElementById('queue-list');
    const adminChatBox = document.getElementById('admin-chat-box');
    const adminForm = document.getElementById('admin-form');
    const adminInput = document.getElementById('admin-input');
    const takeoverToggle = document.getElementById('takeover-toggle');
    const modeStatus = document.getElementById('mode-status');
    const activeRoomTitle = document.getElementById('active-room-title');

    // Fungsi Auto-Link (Ubah URL teks biasa jadi link aktif bisa diklik)
    function linkify(inputText) {
      if (!inputText) return '';
      let replacedText, replacePattern1, replacePattern2;

      replacePattern1 = /(\b(https?|ftp):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/gim;
      replacedText = inputText.replace(replacePattern1, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');

      replacePattern2 = /(^|[^\/])(www\.[\S]+(\b|$))/gim;
      replacedText = replacedText.replace(replacePattern2, '$1<a href="http://$2" target="_blank" rel="noopener noreferrer">$2</a>');

      return replacedText;
    }

    // Minta daftar room saat admin pertama kali terhubung
    socket.on('update_room_list', (rooms) => {
      allRoomsData = rooms;
      renderQueueList();

      // Jika sedang berada di dalam room aktif, perbarui status/header secara real-time
      if (currentRoomId && rooms[currentRoomId]) {
        updateRoomUI(rooms[currentRoomId]);
      }
    });

    function renderQueueList() {
      queueList.innerHTML = '';
      const roomIds = Object.keys(allRoomsData);

      if (roomIds.length === 0) {
        queueList.innerHTML = '<div class="text-xs text-slate-500 text-center py-4">Belum ada antrean member.</div>';
        return;
      }

      roomIds.forEach(id => {
        const room = allRoomsData[id];
        let lastMsg = 'Belum ada pesan...';
        if (room.history.length > 0) {
          const lastItem = room.history[room.history.length - 1];
          lastMsg = lastItem.text ? lastItem.text : (lastItem.image ? '[Mengirim Gambar]' : '...');
        }
        const isSelected = id === currentRoomId;

        const card = document.createElement('div');
        card.className = `p-3 rounded-xl cursor-pointer border transition ${
          isSelected 
            ? 'bg-indigo-950/80 border-indigo-500' 
            : 'bg-slate-900/40 border-slate-800 hover:border-slate-700'
        }`;
        
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="font-semibold text-sm text-slate-200">${room.username}</span>
            <span class="w-2 h-2 ${room.isHumanTakeover ? 'bg-amber-400' : 'bg-emerald-400'} rounded-full"></span>
          </div>
          <p class="text-[11px] text-indigo-300 mt-0.5">Perihal: ${room.category}</p>
          <p class="text-xs text-slate-400 mt-1 truncate">${lastMsg}</p>
        `;

        card.onclick = () => switchRoom(id);
        queueList.appendChild(card);
      });
    }

    function switchRoom(roomId) {
      currentRoomId = roomId;
      const room = allRoomsData[roomId];
      
      updateRoomUI(room);
      renderQueueList(); 
    }

    function updateRoomUI(room) {
      activeRoomTitle.innerText = `Percakapan Aktif: ${room.username} (${room.category})`;
      takeoverToggle.checked = room.isHumanTakeover;
      updateModeText(room.isHumanTakeover);

      // Render Riwayat Chat
      adminChatBox.innerHTML = '';
      room.history.forEach(msg => {
        appendMessageToUI(msg, room.username);
      });
      adminChatBox.scrollTop = adminChatBox.scrollHeight;
    }

    takeoverToggle.onchange = () => {
      if (!currentRoomId) return;
      const isHumanTakeover = takeoverToggle.checked;
      socket.emit('toggle_takeover', { roomId: currentRoomId, isHumanTakeover });
      updateModeText(isHumanTakeover);
    };

    socket.on('takeover_updated', (isHumanTakeover) => {
      takeoverToggle.checked = isHumanTakeover;
      updateModeText(isHumanTakeover);
    });

    function updateModeText(isHuman) {
      if (isHuman) {
        modeStatus.innerText = 'Mode: CS Manusia Aktif (Bot Dinonaktifkan)';
        modeStatus.className = 'text-xs text-amber-400 font-semibold';
      } else {
        modeStatus.innerText = 'Mode: AI Autopilot Aktif';
        modeStatus.className = 'text-xs text-emerald-400 font-semibold';
      }
    }

    adminForm.onsubmit = (e) => {
      e.preventDefault();
      if (!currentRoomId) {
        alert('Silakan pilih salah satu antrean chat terlebih dahulu di sebelah kiri!');
        return;
      }
      const text = adminInput.value.trim();
      if (text) {
        socket.emit('admin_message', { roomId: currentRoomId, text });
        adminInput.value = '';
      }
    };

    function sendQuickReply(text) {
      if (!currentRoomId) {
        alert('Silakan pilih salah satu antrean chat terlebih dahulu di sebelah kiri!');
        return;
      }
      socket.emit('admin_message', { roomId: currentRoomId, text });
    }

    // Penerimaan Pesan Real-Time
    socket.on('new_message', (msg) => {
      // Perbarui history room di memori lokal admin jika room tersebut terdaftar
      if (allRoomsData[msg.roomId]) {
        allRoomsData[msg.roomId].history.push(msg);
        renderQueueList(); // Update preview list di sidebar
      }

      // Jika pesan masuk untuk room yang sedang aktif dibuka admin saat ini
      if (currentRoomId === msg.roomId) {
        const room = allRoomsData[currentRoomId];
        appendMessageToUI(msg, room.username);
        adminChatBox.scrollTop = adminChatBox.scrollHeight;
      }
    });

    function appendMessageToUI(msg, memberUsername) {
      const msgDiv = document.createElement('div');
      const isMember = msg.sender === memberUsername;

      msgDiv.className = `flex flex-col ${isMember ? 'items-start' : 'items-end'}`;

      let imageHtml = '';
      if (msg.image) {
        imageHtml = `<div class="mb-2"><img src="${msg.image}" alt="Bukti Gambar" class="max-w-[200px] rounded-lg border border-slate-700 cursor-pointer" onclick="window.open(this.src)"></div>`;
      }

      let formattedText = linkify(msg.text);

      msgDiv.innerHTML = `
        <span class="text-[10px] text-slate-500 mb-1">${msg.sender}</span>
        <div class="p-3 rounded-xl text-xs max-w-[70%] chat-text ${
          isMember 
            ? 'bg-slate-800 text-slate-200 border border-slate-700' 
            : 'bg-indigo-900/80 text-indigo-100 border border-indigo-700/50'
        }">
          ${imageHtml}
          ${formattedText}
        </div>
      `;
      adminChatBox.appendChild(msgDiv);
    }
  </script>
</body>
</html>
