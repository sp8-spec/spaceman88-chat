<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  // Ambil elemen UI
  const chatForm = document.querySelector('form') || document.getElementById('chat-form');
  const messageInput = document.querySelector('input[type="text"]') || document.getElementById('message-input');
  const chatBox = document.querySelector('.chat-body') || document.getElementById('chat-box');
  const sendBtn = document.querySelector('button[type="submit"]') || document.getElementById('send-btn');

  // Ambil nama user (contoh dari salam awal: "Bapak Tami")
  const username = "Bapak Tami"; 

  // Konek ke room chat
  socket.emit('join_chat', { username: username, category: 'Transaksi Depo / WD' });

  // Fungsi untuk menampilkan gelembung pesan ke layar
  function appendMessage(sender, text, isUser) {
    const msgDiv = document.createElement('div');
    msgDiv.style.margin = "10px 0";
    msgDiv.style.textAlign = isUser ? "right" : "left";
    
    const bubble = document.createElement('div');
    bubble.style.display = "inline-block";
    bubble.style.padding = "8px 12px";
    bubble.style.borderRadius = "10px";
    bubble.style.maxWidth = "80%";
    bubble.style.background = isUser ? "#4f46e5" : "#1e293b";
    bubble.style.color = "#ffffff";
    bubble.style.fontSize = "13px";
    bubble.style.lineHeight = "1.4";
    bubble.innerHTML = `<strong>${sender}</strong><br>${text}`;

    msgDiv.appendChild(bubble);
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // Fungsi proses kirim pesan
  function sendMessage() {
    const msg = messageInput.value.trim();
    if (!msg) return;

    // 1. Tampilkan pesan user sendiri ke layar secara instan
    appendMessage(username, msg, true);

    // 2. Kirim pesan ke backend (server.js)
    socket.emit('user_message', { message: msg, username: username });

    // 3. Kosongkan kolom input
    messageInput.value = '';
  }

  // Event saat tombol Kirim diklik atau tekan Enter
  if (sendBtn) {
    sendBtn.addEventListener('click', (e) => {
      e.preventDefault();
      sendMessage();
    });
  }

  if (messageInput) {
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });
  }

  // Terima balasan dari CS AI / Human dari server
  socket.on('bot_reply', (data) => {
    appendMessage('CS Spaceman88', data.message, false);
  });
</script>
