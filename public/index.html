<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spaceman88 - Executive Live Support</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    #chat-box::-webkit-scrollbar { width: 4px; }
    #chat-box::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    .chat-text a { color: #818cf8; text-decoration: underline; }
    .chat-text a:hover { color: #a5b4fc; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

  <div class="text-center max-w-md">
    <h1 class="text-3xl font-extrabold text-indigo-400 tracking-wider mb-2">SPACEMAN88</h1>
    <p class="text-slate-400 text-sm">Layanan Pelanggan Eksekutif 24/7. Silakan klik ikon di sudut kanan bawah untuk terhubung dengan layanan prioritas kami.</p>
  </div>

  <!-- Tombol Toggle Floating Chat -->
  <button id="chat-toggle" class="fixed bottom-6 right-6 bg-indigo-700 hover:bg-indigo-600 text-white p-4 rounded-full shadow-2xl transition duration-300 z-50 flex items-center justify-center">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
    </svg>
  </button>

  <!-- Box Container Chat -->
  <div id="chat-widget" class="hidden fixed bottom-20 right-6 w-80 sm:w-96 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col z-50 h-[520px]">
    
    <!-- Header Chat -->
    <div class="bg-indigo-900 border-b border-indigo-800 p-3 flex justify-between items-center text-white">
      <div>
        <h3 class="font-bold text-xs tracking-wide">Spaceman88 Live Support</h3>
        <p class="text-[10px] text-indigo-200">Layanan Prioritas 24 Jam Nonstop</p>
      </div>
      <div class="flex items-center gap-2">
        <!-- Tombol Akhiri Chat oleh Member -->
        <button id="close-chat-btn" title="Akhiri Percakapan" class="bg-rose-600/80 hover:bg-rose-600 text-white px-2 py-1 rounded-lg text-[10px] font-semibold transition hidden">Akhiri Chat</button>
        <button id="chat-close" class="text-indigo-200 hover:text-white font-bold text-sm px-1">✕</button>
      </div>
    </div>

    <!-- TAMPILAN 1: FORM PRE-CHAT -->
    <div id="prechat-screen" class="flex-1 p-6 flex flex-col justify-center bg-slate-900">
      <div class="text-center mb-5">
        <h4 class="font-bold text-slate-100 text-base">Selamat Datang di Spaceman88</h4>
        <p class="text-xs text-slate-400 mt-1">Mohon melengkapi formulir berikut sebelum memulai percakapan.</p>
      </div>

      <form id="prechat-form" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-300 mb-1 font-medium">Username ID Anda</label>
          <input type="text" id="username-input" placeholder="Masukkan User ID..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500" required>
        </div>

        <div>
          <label class="block text-xs text-slate-300 mb-1 font-medium">Kategori Perihal</label>
          <select id="category-input" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500" required>
            <option value="" disabled selected>-- Pilih Perihal Kendala --</option>
            <option value="Transaksi Depo / WD">Transaksi Deposit / Withdraw</option>
            <option value="Bonus & Promo">Informasi Bonus & Promo</option>
            <option value="Lupa Akun / Kata Sandi">Kendala Akun & Kata Sandi</option>
            <option value="Kendala Lainnya">Kendala Lainnya</option>
          </select>
        </div>

        <button type="submit" class="w-full bg-indigo-700 hover:bg-indigo-600 text-white font-semibold text-xs py-3 rounded-xl transition shadow-lg mt-2">
          Hubungkan Layanan Live Chat
        </button>
      </form>
    </div>

    <!-- TAMPILAN 2: ARENA CHAT SYSTEM -->
    <div id="chat-screen" class="hidden flex-1 flex flex-col h-full overflow-hidden">
      <!-- Area Pesan -->
      <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-950/60">
        <!-- Riwayat chat dimuat via JS -->
      </div>

      <!-- Indikator Preview Gambar Terlampir -->
      <div id="image-preview-container" class="hidden px-3 py-2 bg-slate-900 border-t border-slate-800 flex items-center justify-between text-xs text-slate-300">
        <span id="image-file-name" class="truncate max-w-[200px]"></span>
        <button type="button" id="remove-image" class="text-rose-400 hover:text-rose-300 font-bold ml-2">Batalkan</button>
      </div>

      <!-- Form Kirim Pesan & Gambar -->
      <form id="user-form" class="p-3 bg-slate-900 border-t border-slate-800 flex flex-col gap-2">
        <div class="flex gap-2 items-center">
          <input id="user-input" type="text" placeholder="Ketik pesan atau lampirkan bukti..." class="flex-1 bg-slate-950 text-white text-xs rounded-xl px-3 py-2.5 border border-slate-800 focus:outline-none focus:border-indigo-500" />
          <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2.5 rounded-xl text-xs border border-slate-700 transition flex items-center justify-center" title="Kirim Bukti Gambar">
            📷 <input type="file" id="image-input" accept="image/*" class="hidden" />
          </label>
          <button type="submit" id="send-btn" class="bg-indigo-700 hover:bg-indigo-600 text-white text-xs px-4 py-2.5 rounded-xl font-semibold transition">Kirim</button>
        </div>
      </form>
    </div>

  </div>

  <script>
    const socket = io();

    let roomId = sessionStorage.getItem('spaceman_room_id');
    if (!roomId) {
      roomId = 'room_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now();
      sessionStorage.setItem('spaceman_room_id', roomId);
    }

    let userProfile = { 
      username: sessionStorage.getItem('spaceman_username') || '', 
      category: sessionStorage.getItem('spaceman_category') || '' 
    };

    const chatToggle = document.getElementById('chat-toggle');
    const chatWidget = document.getElementById('chat-widget');
    const chatClose = document.getElementById('chat-close');
    const closeChatBtn = document.getElementById('close-chat-btn');
    
    const prechatScreen = document.getElementById('prechat-screen');
    const chatScreen = document.getElementById('chat-screen');
    const prechatForm = document.getElementById('prechat-form');
    const usernameInput = document.getElementById('username-input');
    const categoryInput = document.getElementById('category-input');

    const userForm = document.getElementById('user-form');
    const userInput = document.getElementById('user-input');
    const imageInput = document.getElementById('image-input');
    const chatBox = document.getElementById('chat-box');
    const imagePreviewContainer = document.getElementById('image-preview-container');
    const imageFileName = document.getElementById('image-file-name');
    const removeImageBtn = document.getElementById('remove-image');

    let selectedBase64Image = null;

    chatToggle.onclick = () => chatWidget.classList.toggle('hidden');
    chatClose.onclick = () => chatWidget.classList.add('hidden');

    function linkify(inputText) {
      if (!inputText) return '';
      let replacedText = inputText.replace(/(\b(https?|ftp):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/gim, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
      return replacedText.replace(/(^|[^\/])(www\.[\S]+(\b|$))/gim, '$1<a href="http://$2" target="_blank" rel="noopener noreferrer">$2</a>');
    }

    // Cek jika data sesi sudah ada, langsung masuk ke room chat
    if (userProfile.username && userProfile.category) {
      usernameInput.value = userProfile.username;
      categoryInput.value = userProfile.category;
      
      socket.emit('join_room', { roomId, username: userProfile.username, category: userProfile.category });
      prechatScreen.classList.add('hidden');
      chatScreen.classList.remove('hidden');
      closeChatBtn.classList.remove('hidden');
    }

    prechatForm.onsubmit = (e) => {
      e.preventDefault();
      userProfile.username = usernameInput.value.trim();
      userProfile.category = categoryInput.value;

      sessionStorage.setItem('spaceman_username', userProfile.username);
      sessionStorage.setItem('spaceman_category', userProfile.category);

      socket.emit('join_room', { roomId, username: userProfile.username, category: userProfile.category });

      prechatScreen.classList.add('hidden');
      chatScreen.classList.remove('hidden');
      closeChatBtn.classList.remove('hidden');
    };

    closeChatBtn.onclick = () => {
      if (confirm("Apakah Anda yakin ingin mengakhiri sesi percakapan ini?")) {
        socket.emit('close_room', { roomId });
        sessionStorage.clear();
        location.reload();
      }
    };

    // Handler preview file gambar sebelum dikirim
    imageInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (file.size > 5 * 1024 * 1024) {
        alert('Ukuran file terlalu besar! Maksimal 5MB.');
        imageInput.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = function(uploadEvent) {
        selectedBase64Image = uploadEvent.target.result;
        imageFileName.textContent = file.name;
        imagePreviewContainer.classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    };

    removeImageBtn.onclick = () => {
      selectedBase64Image = null;
      imageInput.value = '';
      imagePreviewContainer.classList.add('hidden');
    };

    socket.on('load_history', (history) => {
      chatBox.innerHTML = '';
      history.forEach(msg => {
        appendMessageUI(msg);
      });
    });

    userForm.onsubmit = (e) => {
      e.preventDefault();
      const text = userInput.value.trim();

      if (!text && !selectedBase64Image) return;

      socket.emit('user_message', { 
        roomId, 
        text, 
        image: selectedBase64Image 
      });

      userInput.value = '';
      selectedBase64Image = null;
      imageInput.value = '';
      imagePreviewContainer.classList.add('hidden');
    };

    function appendMessageUI(msg) {
      const msgDiv = document.createElement('div');
      const isUser = msg.sender === userProfile.username;

      msgDiv.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'}`;

      let imageHtml = '';
      if (msg.image) {
        imageHtml = `<div class="mb-2"><img src="${msg.image}" alt="Bukti Gambar" class="max-w-[200px] rounded-lg border border-slate-700 cursor-pointer hover:opacity-95 transition" onclick="window.open(this.src)"></div>`;
      }

      msgDiv.innerHTML = `
        <span class="text-[10px] text-slate-500 mb-1">${msg.sender}</span>
        <div class="p-3 rounded-xl text-xs max-w-[85%] chat-text ${isUser ? 'bg-indigo-700 text-white' : 'bg-slate-900 text-slate-200 border border-slate-800'}">
          ${imageHtml}
          ${linkify(msg.text)}
        </div>
      `;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    socket.on('new_message', (msg) => {
      appendMessageUI(msg);
    });
  </script>
</body>
</html>
